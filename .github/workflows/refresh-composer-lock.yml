name: Refresh Composer Lock

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Composer Lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Refresh lock for PHP 8.2
        run: composer update --with-all-dependencies --no-interaction --no-progress --no-scripts

      - name: Commit refreshed lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-composer-lock.yml
          git add composer.lock .github/workflows/refresh-composer-lock.yml
          if git diff --cached --quiet; then
            echo "No lock changes needed."
            exit 0
          fi
          git commit -m "chore(composer): refresh lock for PHP 8.2"
          git push

      - name: Trigger CI
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run CI --ref master
