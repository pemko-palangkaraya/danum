name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          if-no-files-found: error

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TZ: Asia/Pontianak
      PGTZ: Asia/Pontianak

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Asia/Pontianak
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d laravel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - name: Validate Composer
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --ansi

      - name: Run tests
        run: php artisan test --ansi
